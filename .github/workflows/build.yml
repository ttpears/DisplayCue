name: Build DisplayCue

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish standalone app
        run: dotnet publish native/MonitorHotkeys.csproj -c Release -r win-x64 --self-contained -o artifacts/DisplayCue
      - name: Archive standalone app
        shell: pwsh
        run: Compress-Archive -Path artifacts/DisplayCue/* -DestinationPath artifacts/DisplayCue-win-x64.zip
      - name: Build Microsoft Store package
        shell: pwsh
        run: ./native/build-store-package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: DisplayCue-${{ github.sha }}
          path: |
            artifacts/DisplayCue-win-x64.zip
            artifacts/store/DisplayCue_*.msix
            artifacts/store/DisplayCue_*.msixupload
      - name: Attach tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/DisplayCue-win-x64.zip
            artifacts/store/DisplayCue_*.msix
            artifacts/store/DisplayCue_*.msixupload
